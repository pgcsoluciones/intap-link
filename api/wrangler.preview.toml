name = "intap-api-preview"
main = "src/preview-entry.ts"
compatibility_date = "2024-02-08"
workers_dev = true

[[routes]]
pattern = "app.preview.intaprd.com/api/*"
zone_name = "intaprd.com"

# El workers.dev queda disponible como endpoint técnico/diagnóstico.

[vars]
ENVIRONMENT = "preview"
WORKER_NAME = "intap-api-preview"
APP_URL = "https://app.preview.intaprd.com"
API_URL = "https://intap-api-preview.fliaprince.workers.dev"
WEB_URL = "https://preview.intaprd.com"
GOOGLE_CLIENT_ID = "564629181337-v7gtpr6tcnbhp2i3opcj89t520sdg0mh.apps.googleusercontent.com"
RESEND_FROM = "noreply@intaprd.com"
ADMIN_EMAILS = "fliaprince@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "intap_db_preview"
database_id = "e9f46214-623f-48da-af13-74198e12b222"
migrations_dir = "migrations-preview"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "intap-r2-preview"
