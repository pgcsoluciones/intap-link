name = "intap-api"
main = "src/production-frontdoor-entry.ts"
compatibility_date = "2024-02-08"

# Producción usa el Worker como front door de App + Web y mantiene /api/*
# en el mismo Worker. Los origins de Pages se fijan a deployments inmutables
# durante el release para evitar mezclar HTML y assets de versiones distintas.
[[routes]]
pattern = "intaprd.com/*"
zone_name = "intaprd.com"

[[routes]]
pattern = "www.intaprd.com/*"
zone_name = "intaprd.com"

[[routes]]
pattern = "app.intaprd.com/*"
zone_name = "intaprd.com"

# Custom Domain interno/público del Worker API.
[[routes]]
pattern = "api.intaprd.com"
custom_domain = true

[vars]
ENVIRONMENT = "production"
APP_URL = "https://app.intaprd.com"
APP_PAGES_ORIGIN = "https://5bdeaf1c.intap-link.pages.dev"
WEB_PAGES_ORIGIN = "https://b0503d7c.intap-web2.pages.dev"
API_URL = "https://intaprd.com"
WEB_URL = "https://intaprd.com"
GOOGLE_CLIENT_ID = "564629181337-v7gtpr6tcnbhp2i3opcj89t520sdg0mh.apps.googleusercontent.com"
# Asistente IA: OPENAI_API_KEY se configura únicamente como Worker secret.
OPENAI_MODEL = "gpt-5.6-luna"
AI_TERMS_VERSION = "ai-assistant-v1.0"
AI_PROFILE_DAILY_LIMIT = "8"
AI_PROFILE_MONTHLY_LIMIT = "100"
AI_PROFILE_MAX_ROUNDS = "2"
AI_PROFILE_COOLDOWN_SECONDS = "20"
FREE_MAX_SERVICES = "3"
RESEND_FROM = "noreply@intaprd.com"
ADMIN_EMAILS = "fliaprince@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "intap_db"
database_id = "3a2d724d-5938-4777-a63e-423bb41862c0"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "intap-r2"

[[d1_databases]]
binding = "AGENTS_DB"
database_name = "intap_agents_db"
database_id = "93c7f5d9-7c44-454b-9e62-073322127c46"
