name = "intap-api-preview"
main = "src/preview-frontdoor-entry.ts"
compatibility_date = "2024-02-08"
workers_dev = true

[[routes]]
pattern = "app.preview.intaprd.com/*"
zone_name = "intaprd.com"

[[routes]]
pattern = "preview.intaprd.com/*"
zone_name = "intaprd.com"

# El Worker Preview actúa como front door de ambos custom domains:
# app.preview.intaprd.com sirve App Preview y preview.intaprd.com sirve Web Preview.
# /api/* se resuelve aquí y el resto se sirve desde los Pages Preview aprobados.
#
# IMPORTANTE: estos origins son deployments inmutables de Pages. No usar el alias
# de rama aquí: una combinación de HTML viejo + assets del deployment nuevo puede
# provocar pantalla negra (JS/CSS respondiendo como text/html por el fallback SPA).

[vars]
ENVIRONMENT = "preview"
WORKER_NAME = "intap-api-preview"
APP_URL = "https://app.preview.intaprd.com"
APP_PAGES_ORIGIN = "https://66405cf4.intap-web2.pages.dev"
WEB_PAGES_ORIGIN = "https://87176916.intap-link.pages.dev"
API_URL = "https://intap-api-preview.fliaprince.workers.dev"
WEB_URL = "https://preview.intaprd.com"
GOOGLE_CLIENT_ID = "564629181337-v7gtpr6tcnbhp2i3opcj89t520sdg0mh.apps.googleusercontent.com"
RESEND_FROM = "noreply@intaprd.com"
ADMIN_EMAILS = "fliaprince@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "intap_db_preview"
database_id = "e9f46214-623f-48da-af13-74198e12b222"
migrations_dir = "migrations-preview"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "intap-r2-preview"
