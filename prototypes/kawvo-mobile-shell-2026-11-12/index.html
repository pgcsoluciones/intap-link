<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Kawvo — exploración móvil unificada · prototipo sin conexión</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b3a;background:#eef3f6;--accent:#087e92;--dark:#142c39;--line:#e0e9ee;--muted:#617484;--surface:#fff;--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-size:14px}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f3b94c;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.6}a{color:inherit}
.demo-banner{background:#172f3c;color:#e7f2f6;padding:9px 12px;text-align:center;font-size:11px;line-height:1.5;font-weight:700;letter-spacing:.02em}.demo-banner strong{color:#fff}
.layout{min-height:100dvh}.desk-rail{display:none}.app{min-height:100dvh;max-width:540px;margin:0 auto;background:#f8fafb;box-shadow:0 0 0 1px #e2e9ed}.app-head{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:12px 18px}.head-row{display:flex;align-items:center;gap:10px}.mark{width:38px;height:38px;border-radius:13px;background:#102f3d;color:white;display:grid;place-items:center;font-weight:900;letter-spacing:-.09em;font-size:19px}.brand{min-width:0;flex:1}.brand-name{font-weight:850;font-size:16px;letter-spacing:-.03em}.brand-line{font-size:11px;color:var(--muted);font-weight:650;margin-top:2px}.round{width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:white;display:grid;place-items:center;font-size:16px}.round svg{width:19px;height:19px}.view{padding:16px 16px calc(110px + env(safe-area-inset-bottom));min-height:620px}
.selector{display:grid;gap:7px;margin:3px 0 15px}.selector label{font-size:11px;color:#566c7a;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.selector select{width:100%;min-height:45px;padding:0 40px 0 13px;border:1px solid #cbdde5;border-radius:13px;background:white;color:var(--dark);font-weight:750}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}h1{font-size:23px;line-height:1.14;letter-spacing:-.045em;margin:0;font-weight:850}h2{font-size:15px;margin:0;letter-spacing:-.02em}p{margin:0}.sub{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}.eyebrow{font-size:10px;letter-spacing:.1em;font-weight:850;color:#328196;text-transform:uppercase}.tag{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:100px;background:#edf6f7;color:#056b79;font-size:11px;font-weight:800;white-space:nowrap}.tag.draft{background:#fff1dc;color:#8d5710}.tag.danger{background:#ffe9e6;color:#9c3d31}
.section{margin-top:19px}.card{border:1px solid var(--line);border-radius:18px;background:white;padding:15px;box-shadow:0 2px 9px rgba(24,52,64,.025)}.card+.card{margin-top:10px}.avatar{width:49px;height:49px;border-radius:16px;background:#e4eef1;display:grid;place-items:center;color:#426372;font-size:21px;flex:0 0 auto}.profile-row{display:flex;gap:12px;align-items:center}.profile-text{min-width:0;flex:1}.profile-name{font-weight:850;font-size:15px}.muted{font-size:12px;line-height:1.55;color:var(--muted)}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.sep{height:1px;background:var(--line);margin:13px 0}.progress-track{height:7px;border-radius:100px;overflow:hidden;background:#e6eef1;margin-top:12px}.progress-fill{height:100%;background:#188b9c;border-radius:100px;transition:width .2s}
.button{min-height:43px;padding:10px 13px;background:#102f3d;color:#fff;border:0;border-radius:12px;font-weight:800}.button.secondary{border:1px solid var(--line);color:#355565;background:white}.button.soft{background:#eaf5f6;color:#086b7b}.button.full{width:100%}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.buttons>*{flex:1}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.tile{min-height:121px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);background:white;padding:14px;border-radius:17px}.tile.primary{border-color:#aed8df;background:#ebf7f8}.tile-icon{font-size:21px;color:#0c7082}.tile strong{font-size:13px}.tile .muted{font-size:11px;margin-top:4px}.minihead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.minihead span{font-size:11px;color:var(--muted)}
.rowitem{display:flex;width:100%;align-items:center;gap:11px;padding:12px 3px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line)}.rowitem:last-child{border-bottom:0;padding-bottom:4px}.row-symbol{display:grid;place-items:center;width:33px;height:33px;border-radius:10px;background:#edf4f7;font-size:17px;flex:none}.row-copy{flex:1;min-width:0}.row-copy strong{font-size:13px;display:block}.chevron{color:#8195a2;font-size:20px}.listmark{color:#098e8a;font-weight:900}.state-note{margin:9px 0 0;padding:11px 12px;border-radius:12px;background:#eaf6f2;color:#236851;font-size:12px;line-height:1.55}.state-note.draft{background:#fff6e8;color:#815514}.state-note.suspended{background:#fff0ee;color:#923e37}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);z-index:10;background:rgba(255,255,255,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px rgba(18,50,64,.04)}.navbtn{border:0;background:transparent;min-height:57px;color:#697d8b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;border-radius:12px}.navbtn.active{color:#0a7283;background:#eaf6f7;font-weight:850}.navbtn span:first-child{font-size:20px;line-height:1.15}.navbtn:disabled{display:none}
.section-title{font-weight:850;font-size:14px;margin:5px 0 10px}.group-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#627d8d;margin-bottom:8px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.pill{border:1px solid var(--line);border-radius:100px;padding:7px 10px;font-weight:700;color:#476170;background:#fff;font-size:11px}.pill.selected{background:#e7f6f7;border-color:#9dced4;color:#075b67}.settings-head{font-size:13px;font-weight:850;margin-bottom:8px}
.editor-grid{display:grid;gap:9px}.editrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px;background:white}.editrow .row-copy{flex:1}.inline-status{color:#277365;font-size:11px;font-weight:800}
.toast{position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));width:min(485px,calc(100% - 30px));background:#183744;color:white;border-radius:15px;padding:13px 16px;box-shadow:0 12px 36px #162f3b33;font-size:12px;line-height:1.5;display:none}.toast.show{display:block}
.device-label{font-size:11px;color:#546a79;font-weight:700}.footer-note{margin-top:24px;text-align:center;color:#84949c;font-size:11px;line-height:1.5}
@media (min-width:700px){.layout{display:grid;grid-template-columns:210px 1fr;max-width:1080px;min-height:100vh;margin:0 auto;padding:26px 24px;gap:22px}.desk-rail{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px 14px;min-height:680px;position:sticky;top:24px;align-self:start}.desk-rail .brand-name{font-size:18px}.desktop-item{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#547080;font-size:13px;font-weight:750;border-radius:12px;padding:13px;width:100%;text-align:left;margin-top:4px}.desktop-item[aria-current="page"]{color:#086d7f;background:#e9f6f7}.desktop-item span{font-size:18px}.rail-grow{flex:1}.app{width:100%;max-width:850px;border-radius:24px;overflow:visible;border:1px solid var(--line);box-shadow:0 12px 40px #26495b13}.bottom{display:none}.view{padding:24px 28px 44px;min-height:650px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.app-head{border-radius:24px 24px 0 0}.demo-banner{border-radius:14px 14px 0 0}.toast{bottom:20px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="layout">
<aside class="desk-rail" aria-label="Navegación demostrativa">
  <div class="head-row" style="margin-bottom:26px"><span class="mark">K</span><div class="brand"><div class="brand-name">Kawvo</div><div class="brand-line">Una experiencia</div></div></div>
  <nav id="desktop-nav" aria-label="Navegación principal"></nav>
  <div class="rail-grow"></div><p class="muted">Prototipo de arquitectura. Sin cuentas ni datos reales.</p>
</aside>
<div class="app">
  <div class="demo-banner">PROTOTIPO INTERACTIVO · <strong>SIN DATOS REALES NI OPERACIONES</strong></div>
  <header class="app-head"><div class="head-row"><span class="mark" aria-hidden="true">K</span><div class="brand"><div class="brand-name">Kawvo <span id="brand-suffix">Link</span></div><div id="brand-role" class="brand-line">Panel personal</div></div><button type="button" class="round" aria-label="Avisos de demostración" data-action="avisos">♧</button><button type="button" class="round" aria-label="Opciones de demostración" data-tab="more">☰</button></div></header>
  <main class="view" id="screen" tabindex="-1"></main>
  <nav class="bottom" id="mobile-nav" aria-label="Navegación principal"></nav>
</div>
</div>
<div class="toast" id="toast" aria-live="polite" role="status"></div>
<script>
(function(){
  "use strict";
  var roles={
    free:{name:"Kawvo Link · Free",line:"Panel personal",person:"Mi presentación digital",detail:"Perfil profesional · Free",state:"draft",progress:60,unread:"",edit:["Identidad y portada","Datos de contacto","Botones principales","Ubicación","Enlaces","Portafolio","Diseño y plantilla"],more:["Mi cuenta y credenciales","Bancos (si el plan permite)","Optimización con IA","Plan y actualizaciones","Soporte"],tasks:["Completar foto y portada","Revisar botones de contacto"],hasAgenda:true,statNote:"El borrador y los requisitos se calculan en los sistemas reales, no en esta demostración."},
    paid:{name:"Kawvo Link",line:"Mi presentación y herramientas",person:"Mi perfil profesional",detail:"Perfil Link · funciones según plan",state:"published",progress:100,unread:"",edit:["Presentación e identidad","Enlaces y contactos","Preguntas frecuentes","Catálogo y productos","Videos y multimedia","Bloques interactivos","Plantilla y apariencia"],more:["Cuenta y credenciales","Productos NFC/QR","Ajustes del plan","Soporte"],tasks:[],hasAgenda:false,statNote:"Las herramientas pagadas siguen en su editor existente; esta maqueta no las reemplaza."},
    med:{name:"KawMed",line:"Panel profesional",person:"Mi perfil médico",detail:"Profesional de salud · KawMed",state:"draft",progress:75,unread:"2 solicitudes",edit:["Identidad y especialidades","Centros de atención","Horarios por centro","Seguros y excepciones","Apariencia del perfil"],more:["Mi cuenta y credenciales","Notificaciones","Instalar app","Suspender cuenta (protegido)","Eliminar cuenta (protegido)"],tasks:["Completar centro de atención","Revisar horarios públicos"],hasAgenda:true,statNote:"Horarios públicos por centro y disponibilidad de Agenda permanecen separados."},
    beneficiary:{name:"Kawvo Link",line:"Perfil patrocinado",person:"Mi presentación patrocinada",detail:"Beneficiario · funciones autorizadas",state:"ready",progress:100,unread:"",edit:["Identidad y portada","Datos del negocio","Galería y multimedia","Botones de cotización y Agenda","Ubicación","Bancos, si se permiten"],more:["Recurso de mi patrocinador","Mi cuenta","Soporte"],tasks:[],hasAgenda:true,statNote:"Publicar requiere guardar y confirmar el estado del mismo perfil con el servidor real."},
    sponsor:{name:"Kawvo · Patrocinador",line:"Administrador Master",person:"Empresa patrocinadora",detail:"Master · administración comercial",state:"published",progress:100,unread:"",edit:["Mi presentación Master","Marca e identidad comercial","Presentación pública Master"],more:["Inventario M/P/L","Vendedores y visitadores autorizados","Asignaciones","Credenciales","Soporte"],tasks:[],hasAgenda:true,statNote:"«Mi presentación» y «Gestión de patrocinio» son áreas distintas, con permisos independientes."}
  };
  var role="free",tab="home",demoState={};
  var screen=document.getElementById("screen"),nav=document.getElementById("mobile-nav"),dnav=document.getElementById("desktop-nav"),toast=document.getElementById("toast");
  var tabs=[["home","⌂","Inicio"],["profile","◉","Perfil"],["agenda","▦","Agenda"],["more","☷","Más"]];
  var icons={"Editar perfil":"✎","Vista previa":"◉","Agenda":"▦","Compartir":"↗"};
  function esc(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
  function getState(){return demoState[role]||roles[role].state}
  function stateLabel(s){return s==="published"?"Publicado":s==="ready"?"Listo para publicar":s==="suspended"?"Suspendido":"Borrador"}
  function stateClass(s){return s==="published"?"":s==="suspended"?"danger":"draft"}
  function navHTML(desktop){return tabs.map(function(t){var disabled=t[0]==="agenda"&&!roles[role].hasAgenda;if(disabled)return "";return '<button type="button" '+(desktop?'class="desktop-item"':'class="navbtn '+(tab===t[0]?'active':'')+'"')+' data-tab="'+t[0]+'" '+(tab===t[0]?'aria-current="page"':'')+'><span aria-hidden="true">'+t[1]+'</span><span>'+t[2]+'</span></button>'}).join("")}
  function picker(){return '<div class="selector"><label for="role">Cambiar tipo de cuenta · solo demostración</label><select id="role">'+Object.keys(roles).map(function(key){return '<option value="'+key+'" '+(key===role?'selected':'')+'>'+esc(roles[key].name+(key==="sponsor"?" · Master":""))+'</option>'}).join("")+'</select></div>'}
  function heading(title,detail){return '<div class="title-row"><div><div class="eyebrow">'+esc(roles[role].line)+'</div><h1 style="margin-top:6px">'+esc(title)+'</h1><p class="sub">'+esc(detail)+'</p></div></div>'}
  function profileCard(){var r=roles[role],s=getState();return '<div class="card"><div class="profile-row"><span class="avatar" aria-hidden="true">'+(role==="med"?"⚕":role==="sponsor"?"▤":"◉")+'</span><div class="profile-text"><div class="profile-name">'+esc(r.person)+'</div><p class="muted">'+esc(r.detail)+'</p><div style="margin-top:7px"><span class="tag '+stateClass(s)+'">'+stateLabel(s)+'</span></div></div></div><div class="sep"></div><div class="between"><strong style="font-size:12px">Configuración de ejemplo</strong><span style="font-size:12px;font-weight:850">'+r.progress+'%</span></div><div class="progress-track"><div class="progress-fill" style="width:'+r.progress+'%"></div></div></div>'}
  function tile(text,desc,action,primary){return '<button type="button" class="tile '+(primary?'primary':'')+'" data-action="'+action+'"><span class="tile-icon" aria-hidden="true">'+(icons[text]||"✓")+'</span><span><strong style="display:block">'+text+'</strong><span class="muted">'+desc+'</span></span></button>'}
  function home(){var r=roles[role],s=getState();var msg=s==="draft"?"Tu presentación está en borrador. Continúa la configuración cuando quieras.":s==="ready"?"El perfil de demostración cumple sus requisitos de ejemplo. Publicar requiere confirmación real.":s==="suspended"?"Ejemplo de perfil suspendido: la reactivación real exige el flujo protegido.":"Tu presentación figura como publicada en este escenario de demostración.";
    var actions=tile("Editar perfil",role==="med"?"Información, centros y seguros":"Contenido y diseño","profile",true)+tile("Vista previa","Ejemplo sin perfil público real","preview",false)+(r.hasAgenda?tile("Agenda",role==="med"?"Solicitudes y disponibilidad":"Citas y solicitudes","agenda",false):tile("Compartir","Enlace y QR del perfil","share",false))+tile("Compartir","Enlace y QR del perfil","share",false);
    return picker()+heading(role==="sponsor"?"Hola, patrocinador":"Bienvenido a Kawvo","Tus herramientas principales, sin perder tus avances.")+profileCard()+'<div class="state-note '+(s!=="published"?"draft":"")+'">'+msg+'</div><section class="section"><div class="minihead"><h2>Accesos principales</h2><span>Según tu rol</span></div><div class="tiles">'+actions+'</div></section>'+(r.tasks.length?'<section class="section"><div class="minihead"><h2>Siguiente paso</h2><span>Configurar</span></div><div class="card">'+r.tasks.map(function(t,i){return '<button class="rowitem" data-tab="profile"><span class="row-symbol">'+(i+1)+'</span><span class="row-copy"><strong>'+esc(t)+'</strong><span class="muted">Continuar en el editor existente</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section>':'')+(role==="sponsor"?'<section class="section"><div class="minihead"><h2>Administración comercial</h2><span>Separada de Mi presentación</span></div><div class="card"><button data-tab="more" class="rowitem"><span class="row-symbol">▤</span><span class="row-copy"><strong>Gestión de patrocinio</strong><span class="muted">Estaciones, asignaciones y recursos</span></span><span class="chevron">›</span></button></div></section>':'')+'<div class="footer-note">Prototipo desconectado · no modifica ningún perfil real.</div>';
  }
  function profile(){var r=roles[role];return picker()+heading("Mi perfil","Edita tus datos en secciones ordenadas. Los formularios reales se conservarán.")+'<div class="card" style="margin-top:13px"><div class="between"><div><strong>'+esc(r.person)+'</strong><p class="muted" style="margin-top:5px">Apartados disponibles para esta cuenta</p></div><span class="tag">'+r.edit.length+' áreas</span></div></div><section class="section"><div class="section-title">Configuración de la presentación</div><div class="editor-grid">'+r.edit.map(function(name,i){return '<button type="button" data-action="editor" class="editrow"><span class="row-symbol">'+(i%2===0?'✎':'▤')+'</span><span class="row-copy"><strong>'+esc(name)+'</strong><span class="muted">Abrir módulo existente</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section><p class="state-note" style="margin-top:14px">'+esc(r.statNote)+'</p>';
  }
  function agenda(){if(!roles[role].hasAgenda){tab="home";return home()}return picker()+heading("Agenda","La gestión de solicitudes y la configuración de disponibilidad permanecen separadas.")+'<div class="card" style="margin-top:13px"><div class="between"><div><strong>Actividad de ejemplo</strong><p class="muted" style="margin-top:5px">No se consultan datos de pacientes ni clientes.</p></div><span class="tag">Demo</span></div></div><section class="section"><h2 class="section-title">Gestión</h2><div class="card">'+["Solicitudes de cita","Disponibilidad y bloqueos","Configuración de la Agenda"].map(function(title,i){return '<button class="rowitem" data-action="agenda"><span class="row-symbol">'+(i===0?'▦':i===1?'◷':'⚙')+'</span><span class="row-copy"><strong>'+title+'</strong><span class="muted">Se conservará el módulo, ruta y scope actuales</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section>'+(role==="med"?'<p class="state-note">Los horarios de cada centro mostrados al paciente NO son la disponibilidad de citas.</p>':role==="sponsor"?'<p class="state-note">La Agenda Master conserva su propio scope y no se mezcla con la del beneficiario.</p>':'');
  }
  function more(){var r=roles[role];return picker()+heading("Más opciones","Herramientas secundarias sin sobrecargar la pantalla de inicio.")+'<section class="section"><div class="card">'+r.more.map(function(name,i){return '<button type="button" class="rowitem" data-action="other"><span class="row-symbol">'+(i===0?'⚙':'⋯')+'</span><span class="row-copy"><strong>'+esc(name)+'</strong><span class="muted">Acceso según permisos y capacidades existentes</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section><section class="section"><div class="card"><div class="between"><strong>Explorar estados visuales</strong><span class="tag">Solo demo</span></div><p class="muted" style="margin:7px 0">Comprueba cómo se ve el mismo contenedor en borrador, listo, publicado e inactivo.</p><div class="pills">'+[["draft","Borrador"],["ready","Listo"],["published","Publicado"],["suspended","Suspendido"]].map(function(it){return '<button class="pill '+(getState()===it[0]?'selected':'')+'" data-state="'+it[0]+'">'+it[1]+'</button>'}).join("")+'</div></div></section>';
  }
  function notify(message){toast.textContent=message;toast.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(function(){toast.classList.remove("show")},3800)}
  function render(){document.getElementById("brand-suffix").textContent=role==="med"?"Med":role==="sponsor"?"Master":"Link";document.getElementById("brand-role").textContent=roles[role].line;nav.innerHTML=navHTML(false);dnav.innerHTML=navHTML(true);screen.innerHTML=tab==="profile"?profile():tab==="agenda"?agenda():tab==="more"?more():home()}
  document.addEventListener("change",function(ev){if(ev.target.id==="role"){role=ev.target.value;tab="home";render();notify("Cambiado a "+roles[role].name+". Solo se ha actualizado el prototipo.")}});
  document.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;if(b.dataset.tab){if(b.dataset.tab==="agenda"&&!roles[role].hasAgenda)return;tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:"instant"});return}if(b.dataset.state){demoState[role]=b.dataset.state;render();notify("Estado visual simulado: "+stateLabel(getState())+". No se ha publicado ni editado nada.");return}if(b.dataset.action){notify("Demostración: «"+(b.textContent||b.dataset.action).trim().slice(0,52)+"». La acción real permanece desconectada y protegida.")}});
  render();
})();
</script>
</body>
</html>
