<body>
<div class="layout">
<aside class="desk-rail" aria-label="Navegación demostrativa">
  <div class="head-row" style="margin-bottom:26px"><span class="mark">K</span><div class="brand"><div class="brand-name">Kawvo</div><div class="brand-line">Una experiencia</div></div></div>
  <nav id="desktop-nav" aria-label="Navegación principal"></nav>

</aside>
<div class="app">
  <div class="demo-banner">PROTOTIPO INTERACTIVO · <strong>SIN DATOS REALES NI OPERACIONES</strong></div>
  <header class="app-head"><div class="head-row"><span class="mark" aria-hidden="true">K</span><div class="brand"><div class="brand-name">Kawvo <span id="brand-suffix">Link</span></div><div id="brand-role" class="brand-line">Panel personal</div></div><button type="button" class="round" aria-label="Avisos de demostración" data-action="avisos">♧</button><button type="button" class="round" aria-label="Opciones de demostración" data-tab="more">☰</button></div></header>
  <main class="view" id="screen" tabindex="-1"></main>
  <nav class="bottom" id="mobile-nav" aria-label="Navegación principal"></nav>
</div>
</div>
<div class="toast" id="toast" aria-live="polite" role="status"></div>
<script>
(function(){
  "use strict";
  var roles={
    free:{name:"Kawvo Link · Free",line:"Panel personal",person:"Mi presentación digital",detail:"Perfil profesional · Free",state:"draft",progress:60,unread:"",edit:["Identidad y portada","Datos de contacto","Botones principales","Ubicación","Enlaces","Portafolio","Diseño y plantilla"],more:["Mi cuenta y credenciales","Bancos (si el plan permite)","Optimización con IA","Plan y actualizaciones","Soporte"],tasks:["Completar foto y portada","Revisar botones de contacto"],hasAgenda:true,statNote:"El borrador y los requisitos se calculan en los sistemas reales, no en esta demostración."},
    paid:{name:"Kawvo Link",line:"Mi presentación y herramientas",person:"Mi perfil profesional",detail:"Perfil Link · funciones según plan",state:"published",progress:100,unread:"",edit:["Presentación e identidad","Enlaces y contactos","Preguntas frecuentes","Catálogo y productos","Videos y multimedia","Bloques interactivos","Plantilla y apariencia"],more:["Cuenta y credenciales","Productos NFC/QR","Ajustes del plan","Soporte"],tasks:[],hasAgenda:false,statNote:"Las herramientas pagadas siguen en su editor existente; esta maqueta no las reemplaza."},
    med:{name:"KawMed",line:"Panel profesional",person:"Mi perfil médico",detail:"Profesional de salud · KawMed",state:"draft",progress:75,unread:"2 solicitudes",edit:["Identidad y especialidades","Centros de atención","Horarios por centro","Seguros y excepciones","Apariencia del perfil"],more:["Mi cuenta y credenciales","Notificaciones","Instalar app","Suspender cuenta (protegido)","Eliminar cuenta (protegido)"],tasks:["Completar centro de atención","Revisar horarios públicos"],hasAgenda:true,statNote:"Horarios públicos por centro y disponibilidad de Agenda permanecen separados."},
    beneficiary:{name:"Kawvo Link",line:"Perfil patrocinado",person:"Mi presentación patrocinada",detail:"Beneficiario · funciones autorizadas",state:"ready",progress:100,unread:"",edit:["Identidad y portada","Datos del negocio","Galería y multimedia","Botones de cotización y Agenda","Ubicación","Bancos, si se permiten"],more:["Recurso de mi patrocinador","Mi cuenta","Soporte"],tasks:[],hasAgenda:true,statNote:"Publicar requiere guardar y confirmar el estado del mismo perfil con el servidor real."},
    sponsor:{name:"Kawvo · Patrocinador",line:"Administrador Master",person:"Empresa patrocinadora",detail:"Master · administración comercial",state:"published",progress:100,unread:"",edit:["Mi presentación Master","Foto, portada y datos propios","Vista previa de mi presentación"],more:["Marca e identidad comercial","Credenciales y seguridad","Mi agenda Master","Permisos del equipo","Soporte"],tasks:[],hasAgenda:true,statNote:"«Mi presentación» y «Gestión de patrocinio» son áreas distintas, con permisos independientes."}
  };
  var role="free",tab="home",demoState={},sponsorView="devices",sponsorFilter="all",sponsorSearch="",sponsorSelected=null;
  var screen=document.getElementById("screen"),nav=document.getElementById("mobile-nav"),dnav=document.getElementById("desktop-nav"),toast=document.getElementById("toast");
  var tabs=[["home","⌂","Inicio"],["profile","◉","Perfil"],["agenda","▦","Agenda"],["more","☷","Más"]];
  var icons={"Editar perfil":"✎","Vista previa":"◉","Agenda":"▦","Compartir":"↗"};
  function esc(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
  function getState(){return demoState[role]||roles[role].state}
  function stateLabel(s){return s==="published"?"Publicado":s==="ready"?"Listo para publicar":s==="suspended"?"Suspendido":"Borrador"}
  function stateClass(s){return s==="published"?"":s==="suspended"?"danger":"draft"}
  function navHTML(desktop){var entries=role==="sponsor"?[["home","⌂","Inicio"],["profile","◉","Perfil"],["sponsorOps","▤","Patrocinios"],["more","☷","Más"]]:tabs;return entries.map(function(t){var disabled=t[0]==="agenda"&&!roles[role].hasAgenda;if(disabled)return "";return '<button type="button" '+(desktop?'class="desktop-item"':'class="navbtn '+(tab===t[0]?'active':'')+'"')+' data-tab="'+t[0]+'" '+(tab===t[0]?'aria-current="page"':'')+'><span aria-hidden="true">'+t[1]+'</span><span>'+t[2]+'</span></button>'}).join("")}
  function picker(){return '<div class="selector"><label for="role">Cambiar tipo de cuenta · solo demostración</label><select id="role">'+Object.keys(roles).map(function(key){return '<option value="'+key+'" '+(key===role?'selected':'')+'>'+esc(roles[key].name+(key==="sponsor"?" · Master":""))+'</option>'}).join("")+'</select></div>'}
  function heading(title,detail){return '<div class="title-row"><div><div class="eyebrow">'+esc(roles[role].line)+'</div><h1 style="margin-top:6px">'+esc(title)+'</h1><p class="sub">'+esc(detail)+'</p></div></div>'}
  function profileCard(){var r=roles[role],s=getState();return '<div class="card"><div class="profile-row"><span class="avatar" aria-hidden="true">'+(role==="med"?"⚕":role==="sponsor"?"▤":"◉")+'</span><div class="profile-text"><div class="profile-name">'+esc(r.person)+'</div><p class="muted">'+esc(r.detail)+'</p><div style="margin-top:7px"><span class="tag '+stateClass(s)+'">'+stateLabel(s)+'</span></div></div></div><div class="sep"></div><div class="between"><strong style="font-size:12px">Configuración de ejemplo</strong><span style="font-size:12px;font-weight:850">'+r.progress+'%</span></div><div class="progress-track"><div class="progress-fill" style="width:'+r.progress+'%"></div></div></div>'}
  function tile(text,desc,action,primary){return '<button type="button" class="tile '+(primary?'primary':'')+'" data-action="'+action+'"><span class="tile-icon" aria-hidden="true">'+(icons[text]||"✓")+'</span><span><strong style="display:block">'+text+'</strong><span class="muted">'+desc+'</span></span></button>'}
  function home(){if(role==="sponsor")return sponsorHome();var r=roles[role],s=getState();var msg=s==="draft"?"Tu presentación está en borrador. Continúa la configuración cuando quieras.":s==="ready"?"El perfil de demostración cumple sus requisitos de ejemplo. Publicar requiere confirmación real.":s==="suspended"?"Ejemplo de perfil suspendido: la reactivación real exige el flujo protegido.":"Tu presentación figura como publicada en este escenario de demostración.";
    var actions=tile("Editar perfil",role==="med"?"Información, centros y seguros":"Contenido y diseño","profile",true)+tile("Vista previa","Ejemplo sin perfil público real","preview",false)+(r.hasAgenda?tile("Agenda",role==="med"?"Solicitudes y disponibilidad":"Citas y solicitudes","agenda",false):tile("Productos","Herramientas de mi plan","profile",false))+tile("Compartir","Enlace y QR del perfil","share",false);
    return picker()+heading(role==="sponsor"?"Hola, patrocinador":"Bienvenido a Kawvo","Tus herramientas principales, sin perder tus avances.")+profileCard()+'<div class="state-note '+(s!=="published"?"draft":"")+'">'+msg+'</div><section class="section"><div class="minihead"><h2>Accesos principales</h2><span>Según tu rol</span></div><div class="tiles">'+actions+'</div></section>'+(r.tasks.length?'<section class="section"><div class="minihead"><h2>Siguiente paso</h2><span>Configurar</span></div><div class="card">'+r.tasks.map(function(t,i){return '<button class="rowitem" data-tab="profile"><span class="row-symbol">'+(i+1)+'</span><span class="row-copy"><strong>'+esc(t)+'</strong><span class="muted">Continuar en el editor existente</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section>':'')+(role==="sponsor"?'<section class="section"><div class="minihead"><h2>Administración comercial</h2><span>Separada de Mi presentación</span></div><div class="card"><button data-tab="more" class="rowitem"><span class="row-symbol">▤</span><span class="row-copy"><strong>Gestión de patrocinio</strong><span class="muted">Estaciones, asignaciones y recursos</span></span><span class="chevron">›</span></button></div></section>':'')+'<div class="footer-note">Prototipo desconectado · no modifica ningún perfil real.</div>';
  }
  function profile(){var r=roles[role];return picker()+heading("Mi perfil","Edita tus datos en secciones ordenadas. Los formularios reales se conservarán.")+'<div class="card" style="margin-top:13px"><div class="between"><div><strong>'+esc(r.person)+'</strong><p class="muted" style="margin-top:5px">Apartados disponibles para esta cuenta</p></div><span class="tag">'+r.edit.length+' áreas</span></div></div><section class="section"><div class="section-title">Configuración de la presentación</div><div class="editor-grid">'+r.edit.map(function(name,i){return '<button type="button" data-action="editor" class="editrow"><span class="row-symbol">'+(i%2===0?'✎':'▤')+'</span><span class="row-copy"><strong>'+esc(name)+'</strong><span class="muted">Abrir módulo existente</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section><p class="state-note" style="margin-top:14px">'+esc(r.statNote)+'</p>';
  }
  function agenda(){if(!roles[role].hasAgenda){tab="home";return home()}return picker()+heading("Agenda","La gestión de solicitudes y la configuración de disponibilidad permanecen separadas.")+'<div class="card" style="margin-top:13px"><div class="between"><div><strong>Actividad de ejemplo</strong><p class="muted" style="margin-top:5px">No se consultan datos de pacientes ni clientes.</p></div><span class="tag">Demo</span></div></div><section class="section"><h2 class="section-title">Gestión</h2><div class="card">'+["Solicitudes de cita","Disponibilidad y bloqueos","Configuración de la Agenda"].map(function(title,i){return '<button class="rowitem" data-action="agenda"><span class="row-symbol">'+(i===0?'▦':i===1?'◷':'⚙')+'</span><span class="row-copy"><strong>'+title+'</strong><span class="muted">Se conservará el módulo, ruta y scope actuales</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section>'+(role==="med"?'<p class="state-note">Los horarios de cada centro mostrados al paciente NO son la disponibilidad de citas.</p>':role==="sponsor"?'<p class="state-note">La Agenda Master conserva su propio scope y no se mezcla con la del beneficiario.</p>':'');
  }
  function more(){var r=roles[role];return picker()+heading("Más opciones","Herramientas secundarias sin sobrecargar la pantalla de inicio.")+'<section class="section"><div class="card">'+r.more.map(function(name,i){return '<button type="button" class="rowitem" data-action="other"><span class="row-symbol">'+(i===0?'⚙':'⋯')+'</span><span class="row-copy"><strong>'+esc(name)+'</strong><span class="muted">Acceso según permisos y capacidades existentes</span></span><span class="chevron">›</span></button>'}).join("")+'</div></section><section class="section"><div class="card"><div class="between"><strong>Explorar estados visuales</strong><span class="tag">Solo demo</span></div><p class="muted" style="margin:7px 0">Comprueba cómo se ve el mismo contenedor en borrador, listo, publicado e inactivo.</p><div class="pills">'+[["draft","Borrador"],["ready","Listo"],["published","Publicado"],["suspended","Suspendido"]].map(function(it){return '<button class="pill '+(getState()===it[0]?'selected':'')+'" data-state="'+it[0]+'">'+it[1]+'</button>'}).join("")+'</div></div></section>';
  }
  // Data is illustrative and lives only in this browser's in-memory variables.
  // Deliberately no requests, tokens, authentication, storage, or activation.
  var demoStations=[
    {id:"S-0008",kind:"Llavero",code:"DEMO-L-008",status:"available",assignee:"Sin asignar",owner:"",team:"",recipient:"",channel:""},
    {id:"S-0012",kind:"Tarjeta",code:"DEMO-T-012",status:"assigned",assignee:"Laura Gómez",owner:"Visitadora",team:"Zona Norte",recipient:"Dr. Ejemplo A",channel:"Visita médica"},
    {id:"S-0015",kind:"Llavero",code:"DEMO-L-015",status:"pending",assignee:"Mario Pérez",owner:"Vendedor",team:"Zona Este",recipient:"Negocio de ejemplo B",channel:"Comercial"},
    {id:"S-0019",kind:"Tarjeta",code:"DEMO-T-019",status:"activated",assignee:"Laura Gómez",owner:"Visitadora",team:"Zona Norte",recipient:"Dra. Ejemplo C",channel:"Visita médica"},
    {id:"S-0024",kind:"Pin NFC",code:"DEMO-P-024",status:"available",assignee:"Sin asignar",owner:"",team:"",recipient:"",channel:""},
    {id:"S-0029",kind:"Llavero",code:"DEMO-L-029",status:"assigned",assignee:"Mario Pérez",owner:"Vendedor",team:"Zona Este",recipient:"Negocio de ejemplo D",channel:"Comercial"}
  ];
  function stationStatus(s){return s==="available"?"Disponible":s==="assigned"?"Asignado":s==="pending"?"Pendiente de activar":"Activado"}
  function sponsorHome(){
    var available=demoStations.filter(function(x){return x.status==="available"}).length;
    var pending=demoStations.filter(function(x){return x.status==="assigned"||x.status==="pending"}).length;
    var active=demoStations.filter(function(x){return x.status==="activated"}).length;
    return picker()+heading("Panel de patrocinio","Un resumen operativo para equipos administrativos, sin términos técnicos.")+
      '<div class="state-note">Datos de demostración. Tu presentación Master y la gestión de patrocinios permanecen separadas.</div>'+
      '<section class="section"><div class="minihead"><h2>Dispositivos y perfiles</h2><span>Ejemplo</span></div><div class="ops-stats">'+
      '<button data-tab="sponsorOps" class="ops-stat"><strong>'+demoStations.length+'</strong><span>Total</span></button>'+
      '<button data-sponsor-view="devices" class="ops-stat"><strong>'+available+'</strong><span>Disponibles</span></button>'+
      '<button data-sponsor-view="assignments" class="ops-stat"><strong>'+pending+'</strong><span>Por activar</span></button>'+
      '<button data-sponsor-view="devices" class="ops-stat"><strong>'+active+'</strong><span>Activados</span></button></div></section>'+
      '<section class="section"><div class="minihead"><h2>¿Qué necesitas hacer?</h2><span>Accesos directos</span></div><div class="tiles">'+
      tile("Patrocinios","Buscar estaciones y perfiles","sponsor-devices",true)+
      tile("Asignaciones","Distribución y responsables","sponsor-assignments",false)+
      tile("Mi presentación","Perfil público Master","profile",false)+
      tile("Agenda Master","Mis citas y solicitudes","agenda",false)+
      '</div></section>'+
      '<section class="section"><div class="card"><div class="minihead"><h2>Atención del día</h2><span>Ejemplo</span></div>'+
      '<button class="rowitem" data-sponsor-view="assignments"><span class="row-symbol">▦</span><span class="row-copy"><strong>'+pending+' estaciones por revisar</strong><span class="muted">Ver a quién se entregaron y quién debe activarlas</span></span><span class="chevron">›</span></button>'+
      '<button class="rowitem" data-sponsor-view="devices"><span class="row-symbol">◉</span><span class="row-copy"><strong>'+available+' estaciones disponibles</strong><span class="muted">Consultar sin consumir ni activar códigos</span></span><span class="chevron">›</span></button></div></section>'+
      '<p class="footer-note">Los contadores son ficticios. Las operaciones reales seguirán sujetas a permisos y confirmación.</p>';
  }
  function sponsorOps(){
    var buttons=[["devices","Dispositivos"],["assignments","Asignaciones"]];
    var filters=sponsorView==="devices"?[["all","Todos"],["available","Disponibles"],["assigned","Asignados"],["pending","Pendientes"],["activated","Activados"]]:[["all","Todas"],["assigned","Asignados"],["pending","Pendientes"],["activated","Activados"]];
    return picker()+heading("Patrocinios","Consulta los dispositivos, responsables y asignaciones de tu organización.")+
      '<div class="ops-switch">'+buttons.map(function(x){return '<button type="button" class="ops-switch-btn '+(sponsorView===x[0]?'active':'')+'" data-sponsor-view="'+x[0]+'" aria-pressed="'+(sponsorView===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'+
      '<div class="ops-search"><label for="sponsor-search">Buscar por estación, persona o zona</label><input id="sponsor-search" type="search" autocomplete="off" placeholder="Ej.: S-0012, Laura, Zona Norte..." value="'+esc(sponsorSearch)+'"></div>'+
      '<div class="ops-filters" aria-label="Filtrar por estado">'+filters.map(function(x){return '<button class="pill '+(sponsorFilter===x[0]?'selected':'')+'" data-sponsor-filter="'+x[0]+'" aria-pressed="'+(sponsorFilter===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'+
      '<section id="ops-results" aria-live="polite"></section>'+
      '<p class="state-note" style="margin-top:15px">Vista demostrativa sin cambios reales: consultar o simular una asignación nunca activa un NFC/QR. En el sistema real se conservarán los permisos por patrocinador y responsable.</p>';
  }
  function renderSponsorResults(){
    var dest=document.getElementById("ops-results");if(!dest)return;
    var rows=demoStations.filter(function(x){return sponsorView==="devices"||(x.status!=="available")}).filter(function(x){return sponsorFilter==="all"||x.status===sponsorFilter}).filter(function(x){return [x.id,x.kind,x.code,x.assignee,x.owner,x.team,x.recipient].join(" ").toLowerCase().includes(sponsorSearch.trim().toLowerCase())});
    var selected=demoStations.find(function(x){return x.id===sponsorSelected});
    if(selected){
      dest.innerHTML='<div class="card ops-detail"><button class="button secondary" data-sponsor-back="1">‹ Volver a resultados</button>'+
      '<div class="eyebrow" style="margin-top:17px">Ficha demostrativa de estación</div><h2 style="font-size:21px;margin:7px 0">'+esc(selected.id)+' · '+esc(selected.kind)+'</h2>'+
      '<div class="ops-detail-grid">'+[
        ["Estado",stationStatus(selected.status)],["Código público",selected.code],
        ["Responsable",selected.assignee],["Rol",selected.owner||"No asignado"],
        ["Departamento / zona",selected.team||"Sin asignación"],["Perfil destinatario",selected.recipient||"Pendiente"]
      ].map(function(p){return '<div><span>'+esc(p[0])+'</span><strong>'+esc(p[1])+'</strong></div>'}).join("")+'</div>'+
      '<button class="button full" data-sponsor-demo="1" style="margin-top:15px">Revisar asignación · demo</button>'+
      '<p class="muted" style="margin-top:9px">No se asigna, activa ni transfiere ningún código. Confirmaciones y permisos se mantendrán en el producto real.</p></div>';
      return;
    }
    dest.innerHTML='<div class="minihead" style="margin-top:11px"><h2>'+ (sponsorView==="devices"?"Inventario de dispositivos":"Asignaciones por responsable") +'</h2><span>'+rows.length+' resultado(s)</span></div>'+
    (rows.length?'<div class="card" style="padding:5px 13px">'+rows.map(function(x){return '<button type="button" class="rowitem ops-row" data-sponsor-item="'+esc(x.id)+'"><span class="row-symbol">'+(x.kind==="Tarjeta"?"▤":"◉")+'</span><span class="row-copy"><strong>'+esc(x.id)+' · '+esc(x.kind)+'</strong><span class="muted">'+esc(x.assignee)+(x.team?" · "+esc(x.team):"")+'</span><span class="tag '+(x.status==="available"?"":x.status==="activated"?"":"draft")+'" style="margin-top:6px">'+stationStatus(x.status)+'</span></span><span class="chevron">›</span></button>'}).join("")+'</div>':'<div class="card"><strong>Sin resultados</strong><p class="muted" style="margin-top:6px">Prueba otra palabra o selecciona «Todos». No se modificó ningún registro.</p></div>');
  }
  function notify(message){toast.textContent=message;toast.classList.add("show");clearTimeout(notify.timer);notify.timer=setTimeout(function(){toast.classList.remove("show")},3800)}
  function render(){document.getElementById("brand-suffix").textContent=role==="med"?"Med":role==="sponsor"?"Master":"Link";document.getElementById("brand-role").textContent=roles[role].line;nav.innerHTML=navHTML(false);dnav.innerHTML=navHTML(true);screen.innerHTML=tab==="profile"?profile():tab==="agenda"?agenda():tab==="more"?more():tab==="sponsorOps"&&role==="sponsor"?sponsorOps():home();if(tab==="sponsorOps"&&role==="sponsor")renderSponsorResults()}
  document.addEventListener("change",function(ev){if(ev.target.id==="role"){role=ev.target.value;tab="home";sponsorView="devices";sponsorFilter="all";sponsorSearch="";sponsorSelected=null;render();notify("Cambiado a "+roles[role].name+". Solo se ha actualizado el prototipo.")}});
  document.addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;if(b.dataset.tab){if(b.dataset.tab==="agenda"&&!roles[role].hasAgenda)return;if(b.dataset.tab==="sponsorOps"&&role!=="sponsor")return;tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:"instant"});return}if(b.dataset.sponsorView&&role==="sponsor"){tab="sponsorOps";sponsorView=b.dataset.sponsorView;sponsorFilter="all";sponsorSelected=null;render();return}if(b.dataset.sponsorFilter&&role==="sponsor"){sponsorFilter=b.dataset.sponsorFilter;sponsorSelected=null;renderSponsorResults();document.querySelectorAll("[data-sponsor-filter]").forEach(function(el){el.classList.toggle("selected",el.dataset.sponsorFilter===sponsorFilter);el.setAttribute("aria-pressed",String(el.dataset.sponsorFilter===sponsorFilter))});return}if(b.dataset.sponsorItem&&role==="sponsor"){sponsorSelected=b.dataset.sponsorItem;renderSponsorResults();return}if(b.dataset.sponsorBack&&role==="sponsor"){sponsorSelected=null;renderSponsorResults();return}if(b.dataset.sponsorDemo&&role==="sponsor"){notify("Solo demostración: no se asignó ni modificó ninguna estación.");return}if(b.dataset.state){demoState[role]=b.dataset.state;render();notify("Estado visual simulado: "+stateLabel(getState())+". No se ha publicado ni editado nada.");return}if(b.dataset.action==="sponsor-devices"&&role==="sponsor"){tab="sponsorOps";sponsorView="devices";sponsorFilter="all";sponsorSearch="";render();return}if(b.dataset.action==="sponsor-assignments"&&role==="sponsor"){tab="sponsorOps";sponsorView="assignments";sponsorFilter="all";sponsorSearch="";render();return}if(b.dataset.action==="profile"&&role==="sponsor"){tab="profile";render();return}if(b.dataset.action==="agenda"&&role==="sponsor"){tab="agenda";render();return}if(b.dataset.action){notify("Demostración: «"+(b.textContent||b.dataset.action).trim().slice(0,52)+"». La acción real permanece desconectada y protegida.")}});
  document.addEventListener("input",function(ev){if(ev.target.id==="sponsor-search"&&role==="sponsor"){sponsorSearch=ev.target.value;renderSponsorResults()}});
  render();
})();
</script>
</body>
</html>
