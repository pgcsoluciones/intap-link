name: G8.1 App Pages isolated Preview stage

on:
  push:
    branches:
      - hotfix/kawvo-g8-1-social-share-header-2026-11-23

permissions:
  contents: read

concurrency:
  group: kawvo-g8-1-app-isolated-preview
  cancel-in-progress: false

jobs:
  stage-app:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Protect main and verify exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/hotfix/kawvo-g8-1-social-share-header-2026-11-23"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Guard no API/Web/OG changes
        shell: bash
        run: |
          set -euo pipefail
          BASE="71dd92b870482427d8576e68d89c3167bcfe8f12"
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test -z "$(git diff --name-only "$BASE"...HEAD -- api web functions)"
          git diff --check "$BASE"...HEAD
      - run: npm ci
      - run: node scripts/test-kawvo-g8-1-social-share-header.mjs
      - name: Build App Preview
        shell: bash
        run: |
          set -euo pipefail
          npm run build:preview -w app
          test -s app/dist/index.html
          test -d app/dist/assets
      - name: Deploy immutable App Pages Preview without touching custom domains
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=wrangler@4.166.0 -- wrangler pages deploy app/dist \
            --project-name intap-web2 \
            --branch hotfix/kawvo-g8-1-social-share-header-2026-11-23 \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false 2>&1 | tee /tmp/kawvo-g8-1-stage-app.log
          grep -q 'Deployment complete' /tmp/kawvo-g8-1-stage-app.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## G8.1 App isolated Pages Preview' >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- Only project: intap-web2; branch isolated from production' >> "$GITHUB_STEP_SUMMARY"
          echo '- No Web/API/D1/R2 deployment, no Preview frontdoor modification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Shell on isolated pages.dev requires host-pairing validation before functional QA' >> "$GITHUB_STEP_SUMMARY"
