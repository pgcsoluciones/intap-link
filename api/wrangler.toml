name = "intap-api"
main = "src/preview-free-entry.ts"
compatibility_date = "2024-02-08"

# Rutas de producción — el Worker maneja /api/* en ambos dominios.
# La zona (zone_name) debe existir en la cuenta Cloudflare; si no,
# también se puede configurar desde el dashboard (Workers → Triggers → Routes).
[[routes]]
pattern = "intaprd.com/api/*"
zone_name = "intaprd.com"

[[routes]]
pattern = "app.intaprd.com/api/*"
zone_name = "intaprd.com"

# Custom Domain interno/público del Worker API.
# Permite llamadas Worker → Worker sin depender
# de un Worker Route same-zone.
[[routes]]
pattern = "api.intaprd.com"
custom_domain = true

[vars]
ENVIRONMENT = "production"
APP_URL = "https://app.intaprd.com"
API_URL = "https://intaprd.com"
WEB_URL = "https://intaprd.com"
GOOGLE_CLIENT_ID = "564629181337-v7gtpr6tcnbhp2i3opcj89t520sdg0mh.apps.googleusercontent.com"
# Asistente IA: modelo económico y límites de aplicación. OPENAI_API_KEY va como secret de Worker.
OPENAI_MODEL = "gpt-5.6-luna"
AI_PROFILE_DAILY_LIMIT = "8"
AI_PROFILE_COOLDOWN_SECONDS = "20"
# Remitente del magic link. Debe ser un dominio verificado en Resend.
# Mientras no esté verificado, Resend solo entrega a la cuenta del owner (plan free).
# Pasos: 1) Verificar intaprd.com en resend.com/domains  2) Hacer deploy
RESEND_FROM = "noreply@intaprd.com"
ADMIN_EMAILS = "fliaprince@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "intap_db"
database_id = "3a2d724d-5938-4777-a63e-423bb41862c0"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "intap-r2"

[[d1_databases]]
binding = "AGENTS_DB"
database_name = "intap_agents_db"
database_id = "93c7f5d9-7c44-454b-9e62-073322127c46"
